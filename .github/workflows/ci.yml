# 只跑矩阵门禁。构建与测试在本地跑（`dotnet test`）：解决方案用 ProjectReference
# 引用仓库外的引擎源码，CI 上要额外克隆引擎并拼路径，维护成本大于收益。
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # 矩阵门禁：不需要旧版仓库，任何机器/CI 都能跑。
  # 校验内容：行数与命令集、行为 ID 前缀、状态与等级匹配、夹具引用是否存在、
  # 有意差异登记（DIV-xxx）是否存在、行顺序是否偏离旧版帮助顺序。
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate migration matrix
        run: python migration/gen_matrix.py --check
      - name: Fail when the rendered matrix is stale
        run: |
          python migration/gen_matrix.py
          git diff --exit-code -- migration/MIGRATION_MATRIX.md
      - name: Fail when the simplification list is stale
        run: |
          python migration/gen_simplifications.py
          git diff --exit-code -- migration/SIMPLIFICATIONS.md
